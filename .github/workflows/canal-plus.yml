# Robot du matin :
# - alerte Canal+ : un ticket (issue) pour chaque film « à voir » de
#   films.json qui vient d'entrer dans le catalogue Canal+ (abonnement, pas
#   achat ni location) ; GitHub envoie chaque nouveau ticket par mail et sur
#   son application ;
# - canal_plus.json : la liste de l'abonnement (Canal+, OCS, Apple TV) que le
#   site lit pour ses pastilles « canal+ ».
# Aucune brique externe (pas d'avertissement Node.js) : le programme Python est
# dans .github/scripts/canal_plus.py (testé par test_canal_plus.py), relu ici
# à la version exacte de ce passage.
# Pour le lancer à la main : onglet Actions, « alerte canal+ », Run workflow.
name: alerte canal+

on:
  schedule:
    - cron: '0 6 * * *'   # 6 h UTC ; en pratique GitHub le lance plutôt en début d'après-midi
  workflow_dispatch:

permissions:
  contents: write   # canal_plus.json
  issues: write     # les alertes

# Un seul passage à la fois (sinon deux passages simultanés créeraient des tickets en double)
concurrency:
  group: canal-plus
  cancel-in-progress: false

jobs:
  canal-plus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: films à voir arrivés sur Canal+, liste de l'abonnement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCHE: ${{ github.ref_name }}
          PYTHONIOENCODING: utf-8
        run: |
          curl -fsSL "https://raw.githubusercontent.com/$REPO/$GITHUB_SHA/.github/scripts/canal_plus.py" -o canal_plus.py
          python3 canal_plus.py
