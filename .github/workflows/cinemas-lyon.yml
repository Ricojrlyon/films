# Cinémas de Lyon : chaque matin, le programme des 7 prochains jours de dix
# salles (Lumière Terreaux, Bellecour, Fourmi, Comœdia, UGC Part-Dieu,
# Astoria, Cité Internationale, Confluence, Pathé Bellecour, Vaise), lu sur
# AlloCiné, chaque film retrouvé chez TMDB, dans cinemas_lyon.json que le
# site lit (catégorie « à lyon », pastille, fiche). Aucune brique externe
# (pas d'avertissement Node.js) : le programme Python est dans
# .github/scripts/cinemas_lyon.py (testé par test_cinemas_lyon.py), relu
# ici à la version exacte de ce passage.
# Pour le lancer à la main : onglet Actions, « cinémas lyon », Run workflow.
name: cinémas lyon

on:
  # Un passage par jour, voulu vers 7 h à Paris (choix du propriétaire,
  # 2026-11-17). GitHub lance les passages programmés de ce dépôt avec 6 h à
  # 8 h 40 de retard (mesuré du 28/10 au 16/11 : 3 h 30 UTC parti entre
  # 10 h 40 et 12 h UTC ; 6 h UTC, robot Canal+, entre 12 h et 14 h 40 UTC).
  # Il est donc programmé la veille à 22 h 30 UTC, pour partir vers 4 h 30 à
  # 7 h 10 UTC, soit 5 h 30 à 8 h 10 à Paris l'hiver (une heure de plus
  # l'été). S'il partait un jour à l'heure, ce serait la veille au soir :
  # le programme garde ses 7 jours à partir de cette date. Les salles
  # publient la semaine suivante (qui commence le mercredi) le lundi
  # après-midi ou le mardi : le passage du mardi matin la prend.
  schedule:
    - cron: '30 22 * * *'   # 22 h 30 UTC la veille ; en pratique vers 7 h à Paris
  workflow_dispatch:

permissions:
  contents: write

# Un seul passage à la fois (lancement à la main pendant le passage prévu)
concurrency:
  group: cinemas-lyon
  cancel-in-progress: false

jobs:
  cinemas-lyon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: programme des cinémas de Lyon
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCHE: ${{ github.ref_name }}
          PYTHONIOENCODING: utf-8
        run: |
          curl -fsSL "https://raw.githubusercontent.com/$REPO/$GITHUB_SHA/.github/scripts/cinemas_lyon.py" -o cinemas_lyon.py
          python3 cinemas_lyon.py
